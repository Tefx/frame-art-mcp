[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frame-art-mcp"
version = "0.1.0"
description = "Safety-gated Samsung Frame art projection with matte optical conditioning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=1.26,<2", "samsungtvws[async,encrypted]", "pillow", "numpy", "scipy", "httpx"]

[project.scripts]
frame-art-mcp = "frame_art_mcp.server:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
tmp_path_retention_count = 0
